# O Prometheus rodando o Prometheus. Este arquivo é o próprio dogfooding: se
# testar uma mudança daqui num worktree separado não funcionar, é sinal de que a
# feature não está pronta.
#
# Variáveis disponíveis nos scripts:
#
#   $PROMETHEUS_WORKSPACE_PATH  o worktree onde o script roda
#   $PROMETHEUS_ROOT_PATH       o repositório de onde ele saiu
#   $PROMETHEUS_WORKSPACE_NAME  o nome deste workspace
#   $PROMETHEUS_PORT            porta reservada só para ele, mais nove até +9
#   $PORT                       a mesma porta, para o que já respeita a convenção

[scripts]
# Só as dependências do front: desde que o hook e o sidecar saíram, não há
# binário para compilar antes do primeiro `cargo`.
setup = "npm install"

# O app de verdade deste worktree, isolado do que estiver instalado e de qualquer
# outro worktree: porta e `~/.prometheus-dev-<workspace>` próprios. É o teste
# honesto — Tauri, PTY e Claude Code de verdade.
[scripts.run.app]
command = "sh scripts/app.sh"
default = true

# A mesma UI no Chrome, sem Tauri. O back é o `src/mock.ts`, então isto testa a
# tela e não o Rust — em troca, é o único caminho que um Playwright dirige: a
# webview do Tauri no macOS é WKWebView e não fala CDP.
#
# Vite ao fundo e `wait` na frente para o processo não largar o terminal: é o
# que deixa o botão de parar do dock derrubar o servidor junto.
#
# `localhost` e não `127.0.0.1`: o vite escuta só em `::1`, e o curl em IPv4
# nunca responderia. E o `kill -0` é o que impede o laço de girar para sempre
# quando o vite nem sobe — porta ocupada, dependência faltando.
[scripts.run.browser]
command = """
PORT=$PROMETHEUS_PORT npx vite &
VITE=$!
until curl -sf "http://localhost:$PROMETHEUS_PORT" >/dev/null; do
  kill -0 "$VITE" 2>/dev/null || exit 1
  sleep 0.2
done
open -a "Google Chrome" "http://localhost:$PROMETHEUS_PORT"
wait
"""
