# git-cliff derives CHANGELOG.md and release notes from Conventional Commits. Include user-visible feat,
# fix, perf and revert entries; omit internal maintenance changes.
# Public commit descriptions explain observable behavior in Portuguese without implementation filenames
# or function names. See AGENTS.md.

[changelog]
header = """
# Changelog

O que muda no Prometeu, versão a versão, para quem usa o app.
As versões saem de `sh scripts/release.sh`; este arquivo é gerado a partir dos
commits pelo git-cliff, e as notas de cada release no GitHub são a seção dela.

"""
body = """
{%- if version -%}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{%- else -%}
## [Unreleased]
{%- endif %}
<!-- lang:pt-BR -->
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | split(pat="|") | first }}
{% for commit in commits %}
- {% if commit.breaking %}**Quebra:** {% endif %}{% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | split(pat="
") | first | trim | upper_first }}
{%- endfor %}
{% endfor %}
<!-- lang:en -->
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | split(pat="|") | last }}
{% for commit in commits %}
{% for footer in commit.footers %}
{% if footer.token == "Release-EN" %}
- {% if commit.breaking %}**Breaking:** {% endif %}{{ footer.value | trim | upper_first }}
{%- endif %}
{%- endfor %}
{%- endfor %}
{% endfor %}
<!-- lang:end -->
"""
footer = ""
trim = false

[git]
conventional_commits = true
# Keep legacy unconventional commits in the fallback group instead of silently dropping them.
filter_unconventional = false
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
topo_order = false
commit_parsers = [
  # These commits were labeled fix but only refactored process parameters and development setup. Exclude
  # them without rewriting main.
  { sha = "09b19f1538a3d717e89482c37d5039d86b8fa2f6", skip = true },
  { sha = "cf6ada07ddfacb2d970d2fc15e4684b3344e417a", skip = true },
  # The first branding PR retained its original commit and a duplicate public merge message. Count only
  # the original.
  { sha = "d35d5c3132adf64caa63006dadfb0aa73bfec7a2", skip = true },
  # This feat(ui) commit only reorganized shared components without changing visible behavior. Exclude it
  # without rewriting main.
  { sha = "15bbd4235cbbb7a04227494adcc8171a1a46b0aa", skip = true },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^Marcar a versão", skip = true },
  { message = "^Merge ", skip = true },
  { message = "^feat", group = "<!-- 0 -->Novidades|New" },
  { message = "^fix", group = "<!-- 1 -->Correções|Fixes" },
  { message = "^perf", group = "<!-- 2 -->Desempenho|Performance" },
  { message = "^revert", group = "<!-- 3 -->Revertido|Reverted" },
  { message = "^(chore|ci|build|docs|test|style|refactor)(\\(|:|!)", skip = true },
  { message = ".*", group = "<!-- 4 -->Outros|Other" },
]

[bump]
# During 0.x, feat and fix bump patch while breaking changes bump minor. Moving to 1.0 requires an
# explicit decision.
features_always_bump_minor = false
breaking_always_bump_major = false
