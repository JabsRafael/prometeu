<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prometheus</title>
  </head>
  <body>
    <!-- Navegação nunca some: trocar de workspace não é trocar de modo. -->
    <nav class="rail" id="rail">
      <div class="railtop" data-tauri-drag-region="deep">
        <button id="railtoggle" class="ico" data-t-title="rail.hide"></button>
        <span class="spacer"></span>
        <button id="back" class="ico nav" data-t-title="nav.back" disabled></button>
        <button id="fwd" class="ico" data-t-title="nav.fwd" disabled></button>
      </div>
      <div class="railbody" id="railbody"></div>
      <!-- Rodapé da barra: por ora só a versão. É o canto onde ajuda e
           configurações vão morar, e a faixa já reserva o lugar deles. -->
      <div class="railfoot">
        <button id="settings" class="ico sm" data-t-title="top.settings"></button>
        <span class="ver" id="ver"></span>
        <span class="spacer"></span>
        <button id="update" class="ghost sm" hidden></button>
      </div>
    </nav>

    <div class="stack">
      <header class="top" data-tauri-drag-region="deep">
        <button id="railshow" class="ico" data-t-title="rail.show" hidden></button>
        <div id="crumb" class="crumb"></div>
        <span class="spacer"></span>
        <span id="msg" class="msg"></span>
        <div id="wsctl" class="wsctl" hidden>
          <span id="wsstatus" class="chip"></span>
          <!-- Quem do time está olhando a conversa aberta: um chip por pessoa. -->
          <span id="watchers" class="watchers"></span>
          <!-- Compartilhar com o time: o workspace vai para a lista dos colegas,
               e a saída das conversas para quem abrir. Só existe com time. -->
          <button id="share" class="ghost md" hidden></button>
          <button id="wsstage" class="ghost md" data-t-title="top.stage"></button>
          <!-- Não cria nada sozinho: injeta na conversa ativa o pedido de PR,
               com o estado do git e os passos. Quem faz é o agente. -->
          <button id="pr" class="outline md" data-t-title="top.pr"></button>
          <!-- Só aparece quando a branch já tem PR aberto: leva até ele no
               navegador, e quem sabe onde ele mora é o `gh`. -->
          <button id="prlink" class="ghost md" hidden></button>
          <button id="sidetoggle" class="ico" data-t-title="top.side"></button>
        </div>
      </header>

      <main>
        <!-- Issues do Linear no seu nome, e o atalho para virar workspace.
             Desenhada por `issues.ts`. -->
        <section id="issuesView" class="view issues" hidden>
          <div class="listmain">
            <div class="subbar ibar" id="ibar"></div>
            <div class="ilist" id="ilist"></div>
          </div>
        </section>

        <!-- Os arquivados: o que saiu da frente, com busca e o botão que
             devolve worktrees ao disco. Desenhada por `archived.ts`. -->
        <section id="archivedView" class="view issues" hidden>
          <div class="listmain">
            <div class="subbar ibar" id="abar"></div>
            <div class="ilist" id="alist"></div>
          </div>
        </section>

        <!-- Configurações: a conexão com o Linear, e o que mais vier a ser
             ajuste do app e não do repositório. Desenhada por `settings.ts`. -->
        <section id="settingsView" class="view settings" hidden></section>

        <section id="wsView" class="view wsview" hidden>
          <div class="center">
            <div class="subbar tabbar" id="tabbar"></div>
            <!-- A conversa: a timeline e a caixa de escrever, montadas por
                 chat.ts. Não é um terminal — é o que o agente escreveu,
                 desenhado. -->
            <div class="chatwrap" id="chatwrap">
              <!-- Worktree devolvido ao disco, ou ainda sendo montado: o painel
                   conta o que ficou, ou o que está acontecendo. -->
              <div class="offline" id="offline" hidden>
                <span class="offwave" id="offwave" hidden></span>
                <h3 id="offtitle" data-t="gone.title"></h3>
                <p id="offbody" data-t="gone.body"></p>
                <span class="path" id="offpath"></span>
              </div>
            </div>
            <!-- Mudanças: o diff de todos os arquivos empilhado num scroll só. -->
            <div class="diffview" id="diffview" hidden>
              <div class="vbar">
                <span class="vcrumb" id="dcrumb"></span>
                <span class="spacer"></span>
                <button id="dfold" class="ico" data-t-title="diff.foldAll"></button>
              </div>
              <div class="dlist" id="dlist"></div>
            </div>
            <!-- Navegador: o Run do workspace numa webview do sistema por cima
                 deste lugar. O DOM só reserva o buraco; quem desenha é o sistema. -->
            <div class="webview" id="webview" hidden>
              <div class="vbar">
                <input class="wurl" id="wurl" type="text" spellcheck="false" autocomplete="off" data-t-title="web.url" />
                <span class="spacer"></span>
                <button id="wreload" class="ico" data-t-title="web.reload"></button>
                <button id="wext" class="ico" data-t-title="web.external"></button>
              </div>
              <div class="webbody" id="webbody"></div>
            </div>
            <!-- Arquivo aberto pela árvore: toma o lugar do terminal, como no Conductor. -->
            <div class="viewer" id="viewer" hidden>
              <div class="vbar">
                <span class="vcrumb" id="vcrumb"></span>
                <span class="spacer"></span>
                <button id="vcopy" class="ico" data-t-title="viewer.copyPath"></button>
              </div>
              <div class="vcode" id="vcode">
                <div class="gutter" id="vgutter"></div>
                <pre id="vpre"></pre>
              </div>
            </div>
          </div>
          <aside class="side" id="side">
            <!-- A alça na borda esquerda: arrastar muda a largura do painel. -->
            <div class="sideresize" id="sideresize"></div>
            <div class="sidetabs">
              <button id="tab-files" class="sidetab on" data-t="side.files"></button>
              <button id="tab-diff" class="sidetab"><span data-t="side.changes"></span> <span id="diffcount"></span></button>
              <span class="spacer"></span>
              <!-- Revisar: o diff inteiro empilhado no centro, que é o que se
                   lê antes de abrir PR. Só existe quando há o que revisar. -->
              <button id="review" class="ghost sm" data-t-title="side.review.title" hidden></button>
              <button id="collapse" class="ico" data-t-title="side.collapse"></button>
              <button id="reveal" class="ico" data-t-title="side.reveal"></button>
            </div>
            <div class="sidebody">
              <div class="tree" id="tree"></div>
              <div class="difflist" id="difflist" hidden></div>
            </div>
            <!-- Setup prepara o worktree, Run sobe o projeto, e o + abre
                 shells. Todos rodam no mesmo worktree e nenhum é sessão de
                 agente. -->
            <div class="dock" id="dock">
              <div class="docktabs">
                <button id="dock-toggle" class="ico" data-t-title="dock.collapse"></button>
                <!-- Setup e Run são fixos; as abas de terminal vêm do que está
                     aberto, e por isso a faixa é montada pelo dockbar. -->
                <div class="dockstrip" id="dockstrip"></div>
                <!-- O + fica fora da faixa que rola: é o único caminho para um
                     terminal novo, e não pode sair da tela junto com as abas. -->
                <button id="dock-add" class="ico sm" data-t-title="dock.new"></button>
                <span class="spacer"></span>
                <button id="run-open" hidden></button>
                <div class="split" id="runsplit" hidden>
                  <button id="run-go" class="md"></button>
                  <button id="run-pick" class="ico sm" data-t-title="dock.pick"></button>
                </div>
                <button id="dock-again" class="ico" data-t-title="dock.again" hidden></button>
              </div>
              <div class="dockbody">
                <div class="dockwrap" id="dockwrap" hidden><div id="dockterm"></div></div>
                <!-- Um estado vazio só, montado pelo main: o que falta em cada
                     aba é diferente, e três caixas fixas envelheceriam juntas. -->
                <div class="dockempty" id="dockempty">
                  <div class="glyph" id="empty-glyph" hidden></div>
                  <h4 id="empty-title"></h4>
                  <div class="row" id="empty-row"></div>
                  <p id="empty-sub"></p>
                </div>
              </div>
            </div>
          </aside>
        </section>
      </main>
    </div>

    <div class="veil" id="veil" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
