[package]
name = "prometheus"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
default-run = "prometheus"

[[bin]]
name = "prometheus"
path = "src/main.rs"

[[bin]]
name = "prometheus-hook"
path = "src/bin/hook.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
uuid = { version = "1", features = ["v4"] }
dirs = "6"
tauri-plugin-dialog = "2"
