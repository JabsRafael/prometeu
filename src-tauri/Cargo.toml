[package]
name = "prometheus"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
# O nome do binário é o nome que o macOS mostra no Dock e no menu durante o
# `tauri dev`, onde não existe .app com productName para consultar.
default-run = "Prometheus"

[[bin]]
name = "Prometheus"
path = "src/main.rs"

[workspace]
members = ["hook"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
uuid = { version = "1", features = ["v4"] }
dirs = "6"
tauri-plugin-dialog = "2"
