# Roda em todo PR e em todo push na main: type-check do front, testes dos dois
# lados (vitest + cargo test), clippy, e o formato das mensagens de commit.
#
# Tudo no runner self-hosted — o Mac de quem desenvolve, registrado em
# ~/actions-runner e de pé como serviço de login (launchd). Runner hospedado
# do GitHub custa minutos que este projeto não tem; o self-hosted é de graça,
# e o target/ dele persiste entre runs, então o build é incremental. O
# contrapeso: job só roda com o Mac ligado, e o repositório precisa continuar
# privado — runner self-hosted em repo público executa PR de estranho.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  testes:
    name: testes
    runs-on: [self-hosted, macOS]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      # O `generate_context!` embute o dist/ — precisa existir antes do
      # cargo test.
      - run: npm run build

      - run: npm test

      - run: cargo clippy --workspace -- -D warnings
        working-directory: src-tauri

  commits:
    name: mensagens de commit
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, macOS]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: cada commit do PR passa pelo hook
        run: |
          falhou=0
          for sha in $(git rev-list --no-merges \
              ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}); do
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/msg"
            if ! sh .githooks/commit-msg "$RUNNER_TEMP/msg"; then
              echo "::error::commit $sha fora do padrão"
              falhou=1
            fi
          done
          exit $falhou
