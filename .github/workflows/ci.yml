# Roda em todo PR e em todo push na main: type-check do front, testes dos dois
# lados (vitest + cargo test), rustfmt, clippy, e o formato das mensagens de
# commit.
#
# PR executa código do branch, inclusive scripts de dependências. Por isso a
# CI usa uma VM descartável do GitHub; o Mac persistente fica reservado ao
# release, depois de o commit já pertencer à main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  testes:
    name: testes
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.0
          cache: npm

      - run: npm ci

      - name: navegador dos testes de fluxo
        run: npx playwright install chromium

      # Inclui formato, type-check, build do dist/ exigido pelo Tauri, testes
      # web/Rust e Clippy com todos os targets.
      - run: npm run check

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  commits:
    name: mensagens de commit
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: cada commit do PR passa pelo hook
        run: |
          falhou=0
          for sha in $(git rev-list --no-merges \
              ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}); do
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/msg"
            if ! sh .githooks/commit-msg "$RUNNER_TEMP/msg"; then
              echo "::error::commit $sha fora do padrão"
              falhou=1
            fi
          done
          exit $falhou
