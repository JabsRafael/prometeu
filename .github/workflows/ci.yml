# Validate frontend types, web/Rust tests, Rust formatting, Clippy and commit messages on PRs and main
# pushes.
# The repository is private and fork PR workflows remain disabled. Self-hosted jobs execute
# branch-controlled code; preserve this boundary while the runner is registered.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    name: testes
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.0

      # The persistent runner already retains ~/.npm; uploading it again only delays completion and the
      # shared runner queue.

      - run: npm ci

      - name: navegador dos testes de fluxo
        run: npx playwright install chromium webkit

      # Run formatting, type checks, the Tauri-required frontend build, web/Rust tests and Clippy for
      # every target.
      - run: npm run check

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  commits:
    name: mensagens de commit
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: cada commit do PR passa pelo hook
        run: |
          falhou=0
          for sha in $(git rev-list --no-merges \
              ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}); do
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/msg"
            if ! sh .githooks/commit-msg "$RUNNER_TEMP/msg"; then
              echo "::error::commit $sha fora do padrão"
              falhou=1
            fi
          done
          exit $falhou
