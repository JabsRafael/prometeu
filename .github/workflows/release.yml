# Build tags matching v* on GitHub-hosted macOS and Linux runners, sign and create a shared draft
# release in this repository. Notes come from the version's CHANGELOG.md section.
# Drafts do not reach the updater's releases/latest/download/latest.json endpoint. Install and review the
# draft DMG and AppImage before running sh scripts/release.sh publish.
# The updater accepts only newer versions; recovery from a published defect requires a newer release.
# workflow_dispatch verifies a release build from main without publishing or consuming a version.
#
# The draft lands in this same repository, so the job's GITHUB_TOKEN with contents: write is enough;
# no PAT is involved.
#
# Required Secrets (environment "release"):
# TAURI_SIGNING_PRIVATE_KEY: contents of ~/.tauri/prometeu.key.
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD: signing key password.
# APPLE_ID: Apple account email.
# APPLE_PASSWORD: app-specific notarization password.
# APPLE_CERTIFICATE: Developer ID Application certificate as base64-encoded .p12.
# APPLE_CERTIFICATE_PASSWORD: .p12 password.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# A rerun must not overwrite a manifest while another run uploads to the same draft.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REPO: ${{ github.repository }}

jobs:
  build:
    name: Build and sign macOS
    runs-on: macos-latest
    environment: release
    permissions:
      contents: write
    outputs:
      version: ${{ steps.notes.outputs.version }}
      notes: ${{ steps.notes.outputs.notes }}
      release_id: ${{ steps.release.outputs.releaseId }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: commit pertence à main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::release só constrói commits que já pertencem à main"
            exit 1
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.14.0
          cache: npm

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: navegador dos testes de fluxo
        run: npx playwright install chromium webkit

      # Run the same CI gates before signing or publishing.
      - run: npm run check

      - name: versão e notas
        id: notes
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          [ "$GITHUB_REF_TYPE" = tag ] || exit 0

          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::a tag $GITHUB_REF_NAME não bate com a versão $VERSION do package.json"
            exit 1
          fi
          # Extract the version's CHANGELOG.md section without its heading.
          NOTES=$(awk -v v="$VERSION" '
            /^## \[/ { dentro = index($0, "## [" v "]") == 1; next }
            dentro { print }' CHANGELOG.md)
          if [ -z "$(printf '%s' "$NOTES" | tr -d '[:space:]')" ]; then
            echo "::error::CHANGELOG.md não tem a seção [$VERSION]"
            exit 1
          fi
          { echo "notes<<FIM_DAS_NOTAS"; printf '%s\n' "$NOTES"; echo "FIM_DAS_NOTAS"; } >> "$GITHUB_OUTPUT"

      - name: importar certificado Apple
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          [ -n "$APPLE_ID" ] || { echo "::error::falta o secret APPLE_ID"; exit 1; }
          [ -n "$APPLE_PASSWORD" ] || { echo "::error::falta o secret APPLE_PASSWORD"; exit 1; }
          [ -n "$APPLE_CERTIFICATE" ] || { echo "::error::falta o secret APPLE_CERTIFICATE"; exit 1; }
          [ -n "$APPLE_CERTIFICATE_PASSWORD" ] || { echo "::error::falta o secret APPLE_CERTIFICATE_PASSWORD"; exit 1; }

          CERTIFICATE_PATH="$RUNNER_TEMP/prometeu-developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/prometeu-signing.keychain-db"
          KEYCHAIN_LIST_PATH="$RUNNER_TEMP/prometeu-keychains.txt"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 32)
          security list-keychains -d user \
            | sed -E 's/^[[:space:]]*"//; s/"$//' > "$KEYCHAIN_LIST_PATH"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          rm -f "$CERTIFICATE_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | grep -F '"Developer ID Application: Gustavo Brancaglione (6MQT6A482B)"' >/dev/null \
            || { echo "::error::o .p12 não contém o Developer ID Application esperado"; exit 1; }
          KEYCHAINS=()
          while IFS= read -r KEYCHAIN; do
            [ -e "$KEYCHAIN" ] && KEYCHAINS+=("$KEYCHAIN")
          done < "$KEYCHAIN_LIST_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" "${KEYCHAINS[@]}"
          echo "APPLE_BUILD_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "APPLE_KEYCHAIN_LIST=$KEYCHAIN_LIST_PATH" >> "$GITHUB_ENV"

      - name: build assinado → draft neste repositório
        id: release
        if: github.ref_type == 'tag'
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: "Developer ID Application: Gustavo Brancaglione (6MQT6A482B)"
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: "6MQT6A482B"
          # CI=true enables --skip-jenkins in bundle_dmg.sh, avoiding Finder AppleScript and its
          # Automation permission for the changing runner binary. The DMG uses default icon placement.
          CI: "true"
          # Explicitly set TAURI_BUNDLER_DMG_IGNORE_CI=false so tauri-action does not override CI=true
          # and restore Finder AppleScript.
          TAURI_BUNDLER_DMG_IGNORE_CI: "false"
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ steps.notes.outputs.version }}
          releaseBody: ${{ steps.notes.outputs.notes }}
          releaseDraft: true
          includeUpdaterJson: true
          assetNamePattern: '[name]_[arch][ext]'
          args: --verbose

      - name: build assinado, sem publicar
        if: github.ref_type != 'tag'
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: "Developer ID Application: Gustavo Brancaglione (6MQT6A482B)"
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: "6MQT6A482B"
          CI: "true"
          TAURI_BUNDLER_DMG_IGNORE_CI: "false"
        with:
          args: --verbose

      - name: notarizar DMG final
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DMG=$(find src-tauri/target/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)
          [ -n "$DMG" ] || { echo "::error::falta o .dmg"; exit 1; }
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id 6MQT6A482B \
            --wait --timeout 30m
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          spctl -a -t open --context context:primary-signature -v "$DMG"
          # Use assetNamePattern's filename so --clobber replaces the pre-notarization DMG instead of
          # adding another asset.
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            cp "$DMG" "$RUNNER_TEMP/Prometeu_aarch64.dmg"
            gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP/Prometeu_aarch64.dmg" -R "$REPO" --clobber
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.ref_type != 'tag'
        with:
          name: Prometeu_${{ steps.notes.outputs.version }}_${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error
          retention-days: 7

      - name: remover Keychain temporário
        if: always()
        run: |
          if [ -f "${APPLE_KEYCHAIN_LIST:-}" ]; then
            KEYCHAINS=()
            while IFS= read -r KEYCHAIN; do
              [ -e "$KEYCHAIN" ] && KEYCHAINS+=("$KEYCHAIN")
            done < "$APPLE_KEYCHAIN_LIST"
            if [ "${#KEYCHAINS[@]}" -gt 0 ]; then
              security list-keychains -d user -s "${KEYCHAINS[@]}"
            fi
          fi
          if [ -n "${APPLE_BUILD_KEYCHAIN:-}" ]; then
            security delete-keychain "$APPLE_BUILD_KEYCHAIN" || true
          fi

  # tauri-action merges latest.json with the existing draft. Serialize uploads so neither platform
  # can overwrite the other's entry, and reuse the draft ID instead of creating another release.
  linux:
    name: Build and sign Linux
    needs: build
    runs-on: ubuntu-22.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Build on the oldest supported Ubuntu baseline to avoid requiring a newer glibc.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev patchelf

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.14.0
          cache: npm

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          # CI's linux job uses a newer Ubuntu; its native dependencies cannot run on this baseline.
          key: ubuntu-22.04

      - run: npm ci
      - run: npm run build
      - run: npm run test:rust
      - run: npm run lint:rust

      - name: Build signed AppImage in the shared draft
        if: github.ref_type == 'tag'
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.build.outputs.release_id }}
          releaseBody: ${{ needs.build.outputs.notes }}
          tagName: ${{ github.ref_name }}
          releaseDraft: true
          includeUpdaterJson: true
          # tauri-action expands [arch] to amd64 for AppImage; keep the documented x86_64 URL.
          assetNamePattern: 'Prometeu_x86_64[ext]'
          args: --verbose --bundles appimage

      - name: Build signed AppImage without publishing
        if: github.ref_type != 'tag'
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --verbose --bundles appimage

      # The bundled Ubuntu 22.04 libwayland breaks EGL on current Mesa (black window); the host must
      # provide it. Repacking invalidates the updater signature, so sign the patched file again.
      - name: Unbundle libwayland from the AppImage
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          shopt -s nullglob
          images=(src-tauri/target/release/bundle/appimage/*.AppImage)
          [ "${#images[@]}" -eq 1 ] || { echo "::error::expected exactly one AppImage"; exit 1; }
          bash scripts/appimage-unbundle-wayland.sh "${images[0]}"
          rm -f "${images[0]}.sig"
          npx tauri signer sign "${images[0]}"
          echo "APPIMAGE=${images[0]}" >> "$GITHUB_ENV"

      # tauri-action already uploaded the unpatched AppImage and wrote its signature into latest.json.
      # This job is the draft's last writer, so replacing both here cannot race the macOS entries.
      - name: Replace the AppImage in the shared draft
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp "$APPIMAGE" "$RUNNER_TEMP/Prometeu_x86_64.AppImage"
          cp "$APPIMAGE.sig" "$RUNNER_TEMP/Prometeu_x86_64.AppImage.sig"
          gh release download "$GITHUB_REF_NAME" -R "$REPO" -p latest.json -D "$RUNNER_TEMP/manifest"
          jq --arg sig "$(cat "$APPIMAGE.sig")" \
            '.platforms |= with_entries(if (.value.url // "") | endswith(".AppImage") then .value.signature = $sig else . end)' \
            "$RUNNER_TEMP/manifest/latest.json" > "$RUNNER_TEMP/latest.json"
          gh release upload "$GITHUB_REF_NAME" -R "$REPO" --clobber \
            "$RUNNER_TEMP/Prometeu_x86_64.AppImage" \
            "$RUNNER_TEMP/Prometeu_x86_64.AppImage.sig" \
            "$RUNNER_TEMP/latest.json"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.ref_type != 'tag'
        with:
          name: Prometeu_${{ needs.build.outputs.version }}_linux-x86_64_${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig
          if-no-files-found: error
          retention-days: 7

  verify:
    name: conferir a draft
    needs: [build, linux]
    if: github.ref_type == 'tag'
    runs-on: macos-latest
    # Drafts are visible only to write access, so downloading one needs contents: write.
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: command -v minisign >/dev/null || brew install minisign

      - name: baixar o que o build publicou
        run: rm -rf pkg && gh release download "v$VERSION" -R "$REPO" -D pkg && ls -la pkg

      - name: Apple aceita assinatura e notarização
        run: |
          DMG=$(find pkg -maxdepth 1 -name '*.dmg' -print -quit)
          [ -n "$DMG" ] || { echo "::error::falta o .dmg"; exit 1; }
          xcrun stapler validate "$DMG"
          spctl -a -t open --context context:primary-signature -v "$DMG"

      # Exercise the installed updater path: read latest.json, download its package and verify against
      # the public key embedded in the app.
      - name: latest.json aponta para esta versão e a assinatura bate
        env:
          RELEASE_NOTES: ${{ needs.build.outputs.notes }}
        run: python3 scripts/verify-release.py "$VERSION" "$REPO" pkg
