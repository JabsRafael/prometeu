# Dispara na tag `v*` que o scripts/release.sh empurra. Constrói o app no
# runner self-hosted (o Mac de quem desenvolve — ver CLAUDE.md), assina com a
# chave que vive em Secrets e cria uma release **draft** em
# gbrancaglione/prometeu-releases, com as notas tiradas da seção da versão
# no CHANGELOG.md.
#
# Draft é o portão: o updater lê `releases/latest/download/latest.json`, e o
# GitHub só considera "latest" o que foi publicado. Até alguém instalar o .dmg
# da draft, abrir e aprovar, ninguém recebe nada. Publicar é
# `sh scripts/release.sh publish`.
#
# Não existe rollback no updater (ele só instala versão maior que a atual):
# versão ruim publicada se conserta com a seguinte. Por isso o portão.
#
# `workflow_dispatch` constrói sem publicar — serve para conferir que o build
# de release está de pé num commit que já pertence à main, sem gastar versão.
#
# Secrets que este workflow espera (ver CLAUDE.md):
#   RELEASES_TOKEN                       PAT com Contents: read/write no
#                                        prometeu-releases — o GITHUB_TOKEN
#                                        do job não alcança outro repositório
#   TAURI_SIGNING_PRIVATE_KEY            conteúdo de ~/.tauri/prometeu.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD   a senha dela
#   APPLE_ID                              e-mail da conta Apple
#   APPLE_PASSWORD                        senha específica de app para notarização
#   APPLE_CERTIFICATE                     Developer ID Application em .p12/base64
#   APPLE_CERTIFICATE_PASSWORD            senha do .p12
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  REPO: gbrancaglione/prometeu-releases

jobs:
  build:
    name: construir e assinar
    runs-on: [self-hosted, macOS]
    environment: release
    outputs:
      version: ${{ steps.notes.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: commit pertence à main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::release só constrói commits que já pertencem à main"
            exit 1
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.0
          cache: npm

      - run: npm ci

      - name: navegador dos testes de fluxo
        run: npx playwright install chromium webkit

      # Não assina nem publica uma versão que diverge dos mesmos gates da CI.
      - run: npm run check

      - name: versão e notas
        id: notes
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          [ "$GITHUB_REF_TYPE" = tag ] || exit 0

          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::a tag $GITHUB_REF_NAME não bate com a versão $VERSION do package.json"
            exit 1
          fi
          # A seção "## [X.Y.Z]" do CHANGELOG.md, sem o título.
          NOTES=$(awk -v v="$VERSION" '
            /^## \[/ { dentro = index($0, "## [" v "]") == 1; next }
            dentro { print }' CHANGELOG.md)
          if [ -z "$(printf '%s' "$NOTES" | tr -d '[:space:]')" ]; then
            echo "::error::CHANGELOG.md não tem a seção [$VERSION]"
            exit 1
          fi
          { echo "notes<<FIM_DAS_NOTAS"; printf '%s\n' "$NOTES"; echo "FIM_DAS_NOTAS"; } >> "$GITHUB_OUTPUT"

      - name: importar certificado Apple
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          [ -n "$APPLE_ID" ] || { echo "::error::falta o secret APPLE_ID"; exit 1; }
          [ -n "$APPLE_PASSWORD" ] || { echo "::error::falta o secret APPLE_PASSWORD"; exit 1; }
          [ -n "$APPLE_CERTIFICATE" ] || { echo "::error::falta o secret APPLE_CERTIFICATE"; exit 1; }
          [ -n "$APPLE_CERTIFICATE_PASSWORD" ] || { echo "::error::falta o secret APPLE_CERTIFICATE_PASSWORD"; exit 1; }

          CERTIFICATE_PATH="$RUNNER_TEMP/prometeu-developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/prometeu-signing.keychain-db"
          KEYCHAIN_LIST_PATH="$RUNNER_TEMP/prometeu-keychains.txt"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 32)
          security list-keychains -d user \
            | sed -E 's/^[[:space:]]*"//; s/"$//' > "$KEYCHAIN_LIST_PATH"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          rm -f "$CERTIFICATE_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | grep -F '"Developer ID Application: Gustavo Brancaglione (6MQT6A482B)"' >/dev/null \
            || { echo "::error::o .p12 não contém o Developer ID Application esperado"; exit 1; }
          KEYCHAINS=()
          while IFS= read -r KEYCHAIN; do
            [ -e "$KEYCHAIN" ] && KEYCHAINS+=("$KEYCHAIN")
          done < "$KEYCHAIN_LIST_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" "${KEYCHAINS[@]}"
          echo "APPLE_BUILD_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "APPLE_KEYCHAIN_LIST=$KEYCHAIN_LIST_PATH" >> "$GITHUB_ENV"

      - name: build assinado → draft em prometeu-releases
        if: github.ref_type == 'tag'
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: "Developer ID Application: Gustavo Brancaglione (6MQT6A482B)"
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: "6MQT6A482B"
          # Com CI=true o bundler passa --skip-jenkins ao bundle_dmg.sh e o DMG
          # sai sem o AppleScript que arruma ícones no Finder. O self-hosted
          # não recebe CI=true sozinho, e o AppleScript depende de uma
          # permissão de Automation que o macOS dá ao binário do runner — que
          # não é assinado e troca a cada auto-update. O preço: a janela do
          # DMG vem sem os ícones posicionados.
          CI: "true"
          # A tauri-action, no macOS, injeta TAURI_BUNDLER_DMG_IGNORE_CI=true
          # quando a variável não vem de fora — e isso anula o CI=true acima,
          # trazendo o AppleScript de volta. Dizer "false" aqui é o que faz o
          # --skip-jenkins voltar (o bundler olha o valor, não a presença).
          TAURI_BUNDLER_DMG_IGNORE_CI: "false"
        with:
          owner: gbrancaglione
          repo: prometeu-releases
          releaseCommitish: main
          tagName: ${{ github.ref_name }}
          releaseName: ${{ steps.notes.outputs.version }}
          releaseBody: ${{ steps.notes.outputs.notes }}
          releaseDraft: true
          includeUpdaterJson: true
          assetNamePattern: '[name]_[version]_[arch][ext]'
          args: --verbose

      - name: build assinado, sem publicar
        if: github.ref_type != 'tag'
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: "Developer ID Application: Gustavo Brancaglione (6MQT6A482B)"
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: "6MQT6A482B"
          CI: "true"
          TAURI_BUNDLER_DMG_IGNORE_CI: "false"
        with:
          args: --verbose

      - name: notarizar DMG final
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        run: |
          DMG=$(find src-tauri/target/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)
          [ -n "$DMG" ] || { echo "::error::falta o .dmg"; exit 1; }
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id 6MQT6A482B \
            --wait --timeout 30m
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          spctl -a -t open --context context:primary-signature -v "$DMG"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.ref_type != 'tag'
        with:
          name: Prometeu_${{ steps.notes.outputs.version }}_${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error
          retention-days: 7

      - name: remover Keychain temporário
        if: always()
        run: |
          if [ -f "${APPLE_KEYCHAIN_LIST:-}" ]; then
            KEYCHAINS=()
            while IFS= read -r KEYCHAIN; do
              [ -e "$KEYCHAIN" ] && KEYCHAINS+=("$KEYCHAIN")
            done < "$APPLE_KEYCHAIN_LIST"
            if [ "${#KEYCHAINS[@]}" -gt 0 ]; then
              security list-keychains -d user -s "${KEYCHAINS[@]}"
            fi
          fi
          if [ -n "${APPLE_BUILD_KEYCHAIN:-}" ]; then
            security delete-keychain "$APPLE_BUILD_KEYCHAIN" || true
          fi

  verify:
    name: conferir a draft
    needs: build
    if: github.ref_type == 'tag'
    runs-on: [self-hosted, macOS]
    env:
      GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - run: command -v minisign >/dev/null || brew install minisign

      - name: baixar o que o build publicou
        run: rm -rf pkg && gh release download "v$VERSION" -R "$REPO" -D pkg && ls -la pkg

      - name: Apple aceita assinatura e notarização
        run: |
          DMG=$(find pkg -maxdepth 1 -name '*.dmg' -print -quit)
          [ -n "$DMG" ] || { echo "::error::falta o .dmg"; exit 1; }
          xcrun stapler validate "$DMG"
          spctl -a -t open --context context:primary-signature -v "$DMG"

      # O mesmo caminho que o app instalado percorre: lê o latest.json, acha o
      # pacote que ele aponta, confere a assinatura contra a chave pública que
      # vai dentro do binário. Se isto passa, o updater aceita.
      - name: latest.json aponta para esta versão e a assinatura bate
        run: |
          python3 - <<'PY'
          import base64, json, os, sys
          v = os.environ["VERSION"]
          m = json.load(open("pkg/latest.json"))
          assert m["version"] == v, f"latest.json diz {m['version']}, a tag diz {v}"
          p = m["platforms"]["darwin-aarch64"]
          name = p["url"].rsplit("/", 1)[1]
          assert f"/download/v{v}/" in p["url"], p["url"]
          assert os.path.exists(f"pkg/{name}"), f"latest.json aponta para {name}, que não está na release"
          assert os.path.exists(f"pkg/{name}.sig"), f"falta {name}.sig"
          assert any(f.endswith(".dmg") for f in os.listdir("pkg")), "falta o .dmg"
          conf = json.load(open("src-tauri/tauri.conf.json"))
          open("pub.key", "wb").write(base64.b64decode(conf["plugins"]["updater"]["pubkey"]))
          open("pkg.minisig", "wb").write(base64.b64decode(p["signature"]))
          open("pkg.name", "w").write(name)
          print("pacote:", name)
          PY
          minisign -V -m "pkg/$(cat pkg.name)" -p pub.key -x pkg.minisig
